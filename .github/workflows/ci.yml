name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sh-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      # Device scripts run under the Kindle's busybox ash.
      - name: shellcheck (device scripts)
        run: git ls-files -z 'src/*.sh' 'scriptlets/*.sh' | xargs -0 shellcheck -s ash
      # Host tooling declares its own shell in the shebang.
      - name: shellcheck (host tools)
        run: git ls-files -z 'tools/*.sh' | xargs -0 -r shellcheck
      - name: shfmt
        run: git ls-files -z '*.sh' | xargs -0 shfmt -i 2 -d
